name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Windows + 3.8 x86 — ближе всего к цеховой машине (Windows 7 32-bit,
    # Python 3.8.10). Linux + свежий Python ловит то, что устарело.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.8'
            arch: x86
          - os: ubuntu-latest
            python: '3.13'
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q
