name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Windows + 3.8 x86 — ближе всего к цеховой машине (Windows 7 32-bit,
    # Python 3.8.10). Linux + свежий Python ловит то, что устарело.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.8'
            arch: x86
          - os: ubuntu-latest
            python: '3.13'
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q

      # The package must install and work without the source tree next to
      # it: that is how Nestrack uses it.
      - name: Build and install the package
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv .pkgtest
          if [ -x .pkgtest/Scripts/python ]; then PY=.pkgtest/Scripts/python; else PY=.pkgtest/bin/python; fi
          $PY -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PY" -c "import finnpower_counter.core.balance, finnpower_counter.presentation; print('ok')"
          "$GITHUB_WORKSPACE/$PY" -m finnpower_counter --dir "$GITHUB_WORKSPACE/tests/fixtures/shift_ok" --done 5 --lang en
